name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Publish win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # v0.1.0-beta -> 0.1.0-beta
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore Celsius.slnx

      - name: Build
        run: dotnet build Celsius.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Celsius.slnx --no-build -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Celsius.App/Celsius.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "Celsius-${{ steps.version.outputs.tag }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Celsius ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            Celsius-${{ steps.version.outputs.tag }}-win-x64.zip
          body: |
            ## Celsius ${{ steps.version.outputs.tag }}

            System monitor + CPU stress tester for Windows.

            ### ⚠️ Important
            - **Unsigned build.** Windows SmartScreen may warn on first launch.
            - **Requires administrator rights** to read CPU temperature sensors.
            - Uses the LibreHardwareMonitor kernel driver (PawnIO). Some anti-cheat
              software may flag low-level sensor drivers.

            ### Install
            1. Download the `.zip` below.
            2. Extract and run `Celsius.exe` (accept the UAC prompt).

            Requires Windows 10/11 x64. The build is self-contained; no .NET install needed.
